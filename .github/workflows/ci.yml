name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: everglow
          POSTGRES_PASSWORD: everglow
          POSTGRES_DB: everglow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U everglow"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://everglow:everglow@localhost:5432/everglow
      TEST_DATABASE_URL: postgres://everglow:everglow@localhost:5432/everglow_test
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      # CI-only throwaway keys (never used for real data).
      ENCRYPTION_KEY: Y2ktb25seS1lbmNyeXB0aW9uLWtleS0zMi1ieXRlcyE=
      BLIND_INDEX_KEY: Y2ktb25seS1ibGluZC1pbmRleC1rZXktMzItYnl0ZXM=
      SEED_OWNER_EMAIL: owner@everglowet.com
      SEED_OWNER_PASSWORD: ChangeMe-Everglow-2026
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create test database
        run: PGPASSWORD=everglow psql -h localhost -U everglow -d everglow -c "CREATE DATABASE everglow_test"
      - run: npm run lint
      - run: npm run typecheck
      - name: Check formatting
        run: npx prettier --check "src/**/*.{ts,tsx,css}" "scripts/**/*.ts" "tests/**/*.ts"
      - name: Unit and integration tests (pricing, availability, double booking)
        run: npm test
      - name: Migrate and seed
        run: npm run db:migrate && npm run db:seed
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
